<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paulo Henrique Almeida — Nutricionista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --bg-card: #1a1a1a;
      --border: #2e2e2e;
      --gold: #c8a96e;
      --gold-dim: #a08850;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }

    /* ── FOTO DE FUNDO ── */
    .bg-photo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 120%;
      object-fit: cover;
      object-position: center top;
      transform: translateY(-18%);
      z-index: 0;
    }

    /* ── GRADIENTE OVERLAY ── */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(13,13,13,0.05) 0%,
        rgba(13,13,13,0.10) 30%,
        rgba(13,13,13,0.65) 55%,
        rgba(13,13,13,0.92) 72%,
        #0d0d0d 88%
      );
      z-index: 1;
    }

    /* ── CONTAINER ── */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 20px 48px;
    }

    /* ── LOGO ── */
    .brand-logo {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin-bottom: 4px;
    }

    .rule {
      width: 32px;
      height: 1px;
      background: #3a3a3a;
      margin: 2px 0 4px;
    }

    /* ── BUTTONS ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      padding: 15px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-cta { background: var(--gold); color: var(--bg); }
    .btn-cta:hover { background: #d9bb80; }

    .btn-secondary { background: rgba(26,26,26,0.85); color: var(--gold-dim); border: 1px solid var(--border); backdrop-filter: blur(4px); }
    .btn-secondary:hover { background: rgba(34,34,34,0.9); }

    .icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    .footer {
      color: var(--gold);
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>
